[project]
name = "pa"
version = "0.1.0"
description = "Local-first AI personal assistant with an encrypted vault"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Zack Rudin", email = "8495848+zrudin@users.noreply.github.com" },
]
dependencies = [
    "ollama>=0.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-frontmatter>=1.1.0",
    "markdown-it-py>=3.0.0",
    "watchdog>=5.0.0",
    "apscheduler>=3.10.4",
    "lancedb>=0.15.0",
    "pyarrow>=17.0.0",
    "jinja2>=3.1.4",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "ddgs>=8.1.0",
    "trafilatura>=1.12.0",
    "keyring>=25.0.0",
    "mcp>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/zrudin/aleph-oss"
Repository = "https://github.com/zrudin/aleph-oss"
Issues = "https://github.com/zrudin/aleph-oss/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[project.scripts]
pa = "pa.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pa"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
